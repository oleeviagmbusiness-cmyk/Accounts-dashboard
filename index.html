<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oleevia Portal</title>
  <meta name="description" content="Oleevia Grameen Credits corporate gateway for banking and statutory compliance portals.">
  
  <!-- Modern Typography (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       DESIGN TOKENS & BRAND STYLES
       ========================================================================== */
    :root {
      --brand-primary: #014790;
      --brand-accent: #dd052e;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;
      --transition-fast: 150ms ease;
      --transition-normal: 250ms ease;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b1120;
      background-image: url('background.jpg');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #0f172a;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
      padding-left: 24px;
      padding-right: 24px;
    }

    /* Main Container Centering */
    .portal-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 60px 0 30px;
    }

    /* ==========================================================================
       HERO & BRAND LOGO
       ========================================================================== */
    .brand-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 50px;
    }

    .brand-logo-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: transform var(--transition-normal);
    }

    .brand-logo-link:hover {
      transform: scale(1.02);
    }

    .brand-logo {
      width: 380px;
      max-width: 88vw;
      height: auto;
      display: block;
      filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.35));
    }

    /* ==========================================================================
       TWO CARDS GRID (BANKS & COMPLIANCE)
       ========================================================================== */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 28px;
      width: 100%;
      max-width: 760px;
      margin-bottom: 32px;
    }

    @media (max-width: 640px) {
      .cards-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .portal-main {
        padding: 40px 0 24px;
      }

      .brand-hero {
        margin-bottom: 36px;
      }
    }

    /* 60% White Shade Card Styling */
    .portal-card {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 180px;
      background-color: rgba(255, 255, 255, 0.60);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: var(--radius-lg);
      padding: 26px 26px;
      text-decoration: none;
      color: #0f172a;
      box-shadow: 0 14px 34px -4px rgba(1, 71, 144, 0.14), 0 2px 8px rgba(0, 0, 0, 0.04);
      transition: all var(--transition-normal);
      overflow: hidden;
      outline: none;
      cursor: pointer;
    }

    /* Colored Top Accent Bar */
    .portal-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: var(--card-accent, var(--brand-primary));
      opacity: 0.95;
      transition: height var(--transition-fast);
    }

    /* Hover State */
    .portal-card:hover {
      transform: translateY(-6px);
      background-color: rgba(255, 255, 255, 0.88);
      border-color: var(--card-accent, var(--brand-primary));
      box-shadow: 0 24px 44px -8px rgba(1, 71, 144, 0.25), 0 6px 18px rgba(0, 0, 0, 0.08);
    }

    .portal-card:hover::before {
      height: 7px;
    }

    /* Card Icon & Logo Header */
    .card-head {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin-bottom: 24px;
      height: 74px;
    }

    .card-logo-box {
      height: 72px;
      width: auto;
      max-width: 140px;
      border-radius: var(--radius-md);
      background: #ffffff;
      border: 1px solid rgba(1, 71, 144, 0.15);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px 8px;
      box-shadow: 0 4px 12px rgba(1, 71, 144, 0.08);
      overflow: hidden;
      transition: transform var(--transition-fast), box-shadow var(--transition-fast), border-color var(--transition-fast);
    }

    .portal-card:hover .card-logo-box {
      transform: scale(1.05);
      border-color: var(--card-accent, var(--brand-primary));
      box-shadow: 0 6px 18px rgba(1, 71, 144, 0.2);
    }

    .card-custom-logo {
      height: 100%;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      display: block;
    }

    .card-icon-wrapper {
      width: 72px;
      height: 72px;
      border-radius: var(--radius-md);
      background: var(--card-icon-bg, rgba(221, 5, 46, 0.08));
      border: 1px solid var(--card-icon-border, rgba(221, 5, 46, 0.18));
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--card-accent, var(--brand-accent));
      transition: transform var(--transition-fast), background var(--transition-fast), color var(--transition-fast);
    }

    .portal-card:hover .card-icon-wrapper {
      transform: scale(1.05);
      background: var(--card-accent, var(--brand-accent));
      color: #ffffff;
      border-color: var(--card-accent, var(--brand-accent));
    }

    .card-icon-wrapper svg {
      width: 36px;
      height: 36px;
    }

    /* Card Bottom (Title + Arrow) */
    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-title {
      font-size: 1.55rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin: 0;
      transition: color var(--transition-fast);
    }

    .portal-card:hover .card-title {
      color: var(--card-accent, var(--brand-primary));
    }

    .action-arrow-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(1, 71, 144, 0.08);
      border: 1px solid rgba(1, 71, 144, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--card-accent, var(--brand-primary));
      transition: transform var(--transition-fast), background-color var(--transition-fast), color var(--transition-fast);
    }

    .portal-card:hover .action-arrow-circle {
      transform: translate(3px, -3px);
      background-color: var(--card-accent, var(--brand-primary));
      color: #ffffff;
      border-color: var(--card-accent, var(--brand-primary));
    }

    .action-arrow-circle svg {
      width: 18px;
      height: 18px;
    }

  </style>
</head>
<body>

  <!-- ==========================================
       OPENING WEBPAGE CONTENT
       ========================================== -->
  <main class="portal-main">
    <div class="container" style="display: flex; flex-direction: column; align-items: center;">

      <!-- HERO SECTION WITH CENTERED OLEEVIA LOGO -->
      <header class="brand-hero">
        <a href="index.html" class="brand-logo-link" aria-label="Oleevia Home">
          <img src="oleevia-logo-white-text.png" alt="Oleevia" class="brand-logo">
        </a>
      </header>

      <!-- TWO CARDS: BANKS & COMPLIANCE -->
      <section class="cards-grid" aria-label="Portal Navigation">

        <!-- CARD 1: BANKS (LINKED TO BANKING DASHBOARD) -->
        <a href="banks.html" class="portal-card" style="--card-accent: #014790;" title="Banks">
          <div class="card-head">
            <div class="card-logo-box">
              <img src="banks-logo.png" alt="Banks" class="card-custom-logo">
            </div>
          </div>

          <div class="card-bottom">
            <h2 class="card-title">Banks</h2>
            <div class="action-arrow-circle" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="7" y1="17" x2="17" y2="7"/>
                <polyline points="7 7 17 7 17 17"/>
              </svg>
            </div>
          </div>
        </a>

        <!-- CARD 2: COMPLIANCE -->
        <a href="compliance.html" class="portal-card" style="--card-accent: #dd052e; --card-icon-bg: rgba(221, 5, 46, 0.1); --card-icon-border: rgba(221, 5, 46, 0.2);" title="Compliance">
          <div class="card-head">
            <div class="card-icon-wrapper">
              <!-- Shield / Regulatory Compliance Icon -->
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                <path d="M9 12l2 2 4-4"/>
              </svg>
            </div>
          </div>

          <div class="card-bottom">
            <h2 class="card-title">Compliance</h2>
            <div class="action-arrow-circle" aria-hidden="true" style="color: #dd052e; background: rgba(221, 5, 46, 0.08); border-color: rgba(221, 5, 46, 0.16);">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="7" y1="17" x2="17" y2="7"/>
                <polyline points="7 7 17 7 17 17"/>
              </svg>
            </div>
          </div>
        </a>

      </section>

    </div>
  </main>

</body>
</html>
