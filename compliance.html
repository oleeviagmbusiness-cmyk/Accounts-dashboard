<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compliance Portal | Oleevia</title>
  <meta name="description" content="Oleevia regulatory compliance, statutory filings, and audit tracking dashboard.">
  
  <!-- Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --brand-primary: #014790;
      --brand-accent: #dd052e;
      --radius-lg: 16px;
      --transition-normal: 250ms ease;
      --transition-fast: 150ms ease;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #0b1120;
      background-image: url('background.jpg');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #0f172a;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Top Nav */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 20px;
      margin-bottom: 12px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      color: #014790;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 8px 16px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.85);
      text-decoration: none;
      transition: all var(--transition-fast);
      box-shadow: 0 4px 12px rgba(1, 71, 144, 0.08);
    }

    .back-btn:hover {
      background: #ffffff;
      transform: translateX(-2px);
      color: #dd052e;
      box-shadow: 0 6px 16px rgba(1, 71, 144, 0.15);
    }

    /* Header */
    .middle-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 30px;
      text-align: center;
    }

    .middle-logo {
      width: 320px;
      max-width: 82vw;
      height: auto;
      display: block;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.25));
    }

    /* Compliance Cards Grid - 2 Cards */
    .compliance-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
      max-width: 760px;
      margin: 0 auto 40px;
    }

    @media (max-width: 640px) {
      .compliance-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }
    }

    .compliance-card {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
      min-height: 160px;
      background-color: rgba(255, 255, 255, 0.60);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: var(--radius-lg);
      padding: 22px;
      text-decoration: none;
      color: #0f172a;
      box-shadow: 0 10px 28px -4px rgba(1, 71, 144, 0.12), 0 2px 6px rgba(0, 0, 0, 0.04);
      transition: all var(--transition-normal);
      overflow: hidden;
    }

    .compliance-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--card-accent, #014790);
      opacity: 0.9;
      transition: height var(--transition-fast);
    }

    .compliance-card:hover {
      transform: translateY(-4px);
      background-color: rgba(255, 255, 255, 0.88);
      border-color: var(--card-accent, #014790);
      box-shadow: 0 20px 38px -8px rgba(1, 71, 144, 0.22), 0 6px 14px rgba(0, 0, 0, 0.06);
    }

    .compliance-card:hover::before {
      height: 5px;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .icon-badge {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      background: var(--card-icon-bg, rgba(1, 71, 144, 0.08));
      border: 1px solid var(--card-icon-border, rgba(1, 71, 144, 0.15));
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--card-accent, #014790);
      transition: transform var(--transition-fast), background-color var(--transition-fast), color var(--transition-fast);
    }

    .compliance-card:hover .icon-badge {
      transform: scale(1.06);
      background-color: var(--card-accent, #014790);
      color: #ffffff;
      border-color: var(--card-accent, #014790);
    }

    .icon-badge svg {
      width: 25px;
      height: 25px;
    }

    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #0f172a;
      margin: 0;
      transition: color var(--transition-fast);
    }

    .compliance-card:hover .card-title {
      color: var(--card-accent, #014790);
    }

    .arrow-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(1, 71, 144, 0.08);
      border: 1px solid rgba(1, 71, 144, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--card-accent, #014790);
      flex-shrink: 0;
      transition: transform var(--transition-fast), background-color var(--transition-fast), color var(--transition-fast);
    }

    .compliance-card:hover .arrow-btn {
      transform: translate(2px, -2px);
      background: var(--card-accent, #014790);
      color: #ffffff;
      border-color: var(--card-accent, #014790);
    }

  </style>
</head>
<body>
  <div class="container">
    <!-- Top Navigation -->
    <header class="top-nav">
      <a href="index.html" class="back-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Back to Portal
      </a>
    </header>

    <!-- Centered Logo -->
    <div class="middle-section">
      <a href="index.html" aria-label="Oleevia Home">
        <img src="oleevia-logo-white-text.png" alt="Oleevia" class="middle-logo">
      </a>
    </div>

    <!-- Compliance Grid (2 Cards) -->
    <main class="compliance-grid">
      <!-- 1. MCA & ROC Filings -->
      <a href="https://www.mca.gov.in" target="_blank" rel="noopener noreferrer" class="compliance-card" style="--card-accent: #014790; --card-icon-bg: rgba(1, 71, 144, 0.08); --card-icon-border: rgba(1, 71, 144, 0.15);" title="MCA & ROC Filings">
        <div class="card-top">
          <div class="icon-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
          </div>
        </div>
        <div class="card-bottom">
          <h2 class="card-title">MCA & ROC Filings</h2>
          <span class="arrow-btn" aria-hidden="true">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="7" y1="17" x2="17" y2="7"/>
              <polyline points="7 7 17 7 17 17"/>
            </svg>
          </span>
        </div>
      </a>

      <!-- 2. GST & Indirect Tax -->
      <a href="https://www.gst.gov.in" target="_blank" rel="noopener noreferrer" class="compliance-card" style="--card-accent: #0284c7; --card-icon-bg: rgba(2, 132, 199, 0.08); --card-icon-border: rgba(2, 132, 199, 0.18);" title="GST Portal">
        <div class="card-top">
          <div class="icon-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
              <polyline points="10 9 9 9 8 9"/>
            </svg>
          </div>
        </div>
        <div class="card-bottom">
          <h2 class="card-title">GST Portal</h2>
          <span class="arrow-btn" aria-hidden="true">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="7" y1="17" x2="17" y2="7"/>
              <polyline points="7 7 17 7 17 17"/>
            </svg>
          </span>
        </div>
      </a>
    </main>
  </div>
</body>
</html>
